# rhythm-kiosk :: install to /opt/rhythm-kiosk/boot-order.conf
#
# BOOT PRIORITY of the games: one GAME_ID per line, the TOP line boots first.
# When controllers for several games are plugged in at boot, the game listed
# highest here wins. Game ids must match games.conf.
#
# Reorder with bin/mapping-editor.sh ("Reorder boot priorities") or just move
# the lines around by hand. A game missing from this file sorts LAST.
# Blank lines and lines starting with # are ignored.

outfox
clonehero

# Reserved entry: 'desktop' boots to the bare desktop instead of a game.
# Move it to the TOP to make the kiosk always boot to the desktop.
desktop
