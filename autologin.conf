# rhythm-kiosk :: install to /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# systemd drop-in that makes tty1 log the `kiosk` user in automatically.
# Standard mechanism (RetroPie / Arch wiki "Automatic login to virtual console").
# Create the directory first:
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d
# then install this file and:
#   sudo systemctl daemon-reload
#
# The empty ExecStart= is required: it clears the unit's inherited ExecStart
# before setting our own. Do not remove it.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin kiosk --noclear %I $TERM
