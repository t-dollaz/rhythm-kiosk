# rhythm-kiosk :: install to /opt/rhythm-kiosk/controllers.conf
#
# Controller -> game membership used by boot-selector.sh at boot.
#
# Format:  VID:PID  GAME_ID
#   VID:PID   lowercase hex as printed by `lsusb` after "ID ".
#   GAME_ID   must match a GAME_ID in games.conf.
# Blank lines and lines starting with # are ignored.
# 0000:0000 is treated as "not yet known" and never matches.
#
# There is NO priority here: controllers only say WHICH game they belong to.
# WHICH GAME WINS when several controllers are plugged in is decided by
# /opt/rhythm-kiosk/boot-order.conf (top line boots first).
#
# Adding a controller = add a line (or use bin/mapping-editor.sh).

# --- dance pad -> Project OutFox ---------------------------------------------
# TODO(hardware): LTEK pad VID:PID unknown. Plug the pad in ALONE, run `lsusb`,
# and replace 0000:0000 with the ID it reports.
0000:0000   outfox        # LTEK dance pad -- UNKNOWN, fill via lsusb

# --- guitars -> Clone Hero (both guitars map to Clone Hero) ------------------
1430:4748   clonehero     # RedOctane Xbox 360 Guitar Hero X-plorer
# TODO(hardware): CRKD guitar VID:PID unknown; it may enumerate as a generic
# XInput device, in which case check for VID:PID collision with the X-plorer.
0000:0000   clonehero     # CRKD guitar -- UNKNOWN, fill via lsusb


# Nothing matched -> boot-selector exits silently -> bare Openbox desktop
# (= maintenance mode). That is the intended fallback; do not add a catch-all.
