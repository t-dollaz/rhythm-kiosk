# rhythm-kiosk :: install to /opt/rhythm-kiosk/games.conf
#
# Game definitions used by rhythm-launch and by the Openbox games pipe menu.
#
# Format:  GAME_ID|DISPLAY_NAME|FULLSCREEN_CMD|WINDOWED_CMD
#   GAME_ID         referenced by controllers.conf and `rhythm-launch <game-id>`
#   DISPLAY_NAME    shown in the Openbox root menu
#   FULLSCREEN_CMD  used at boot (controller detected) -- game owns the screen
#   WINDOWED_CMD    used by `rhythm-launch <game-id> --windowed` from the root
#                   menu, so settings can be edited with keyboard + mouse
# Lines starting with # and blank lines are ignored. Fields are split on '|',
# so no '|' inside a command; the fields are NOT re-quoted per word, they are
# run as shell command lines.
#
# NOTE: the binary paths below are plausible defaults for the documented
# install layout. Exact paths are fixed at install time (mapping-editor.sh
# writes them when a game is installed) -- verify each one on the target PC.

# Per-game refresh (Pixio PX275h @ DP): no VRR on this iGPU/X11, so each game
# pins the rate it wants -- 95Hz for the music games (input latency win),
# 60Hz for Dolphin (GameCube titles are 60Hz; 95 would judder).
# `xrandr --rate` with no --output acts on the primary display; fine here
# because the kiosk is single-display by design.

clonehero|Clone Hero|xrandr --rate 95; /opt/rhythm-kiosk/games/clonehero/clonehero -screen-fullscreen 1|/opt/rhythm-kiosk/games/clonehero/clonehero -screen-fullscreen 0

outfox|Project OutFox|xrandr --rate 95; /opt/rhythm-kiosk/games/outfox/OutFox --fullscreen|/opt/rhythm-kiosk/games/outfox/OutFox --windowed

