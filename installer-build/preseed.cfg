#### rhythm-kiosk automated install (Debian 13 netinst remaster)
# Interactive by design: language/country/keyboard/accessibility, the kiosk
# user's password, and one final write-changes-to-disk confirmation.
# Everything else is decided here.

### Network: none, ever. The install is fully offline (bundled repo), and
### with no NIC present netcfg would loop its no-interfaces dialog forever at
### critical priority. The installed system gets DHCP via systemd-networkd
### (written by the kiosk installer script), so a plugged cable still works
### after install. Hostname is set in the late_command.
d-i netcfg/enable boolean false

### No mirror, ever: install is fully offline-deterministic. Packages come
### from the CD and the bundled /cdrom/rhythm-repo.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/security_updates boolean false

### Accounts: root disabled; user 'kiosk' with passwordless sudo (set up by
### the late_command). Password prompt stays interactive.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string kiosk
d-i passwd/username string kiosk

### Clock
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

### Partitioning: guided LVM on the whole disk; ONE final confirm stays
### interactive as the safety gate (partman/confirm deliberately not preseeded).
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish

### Base system + no tasks (our repo carries everything the kiosk needs)
d-i base-installer/install-recommends boolean true
tasksel tasksel/first multiselect
d-i pkgsel/include string
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Payload: local repo + package folder onto the target, then the kiosk
### installer in unattended mode (its apt step pulls from the local repo).
d-i preseed/late_command string \
  mkdir -p /target/var/rhythm-repo /target/root/rhythm-kiosk ; \
  cp -r /cdrom/rhythm-repo/. /target/var/rhythm-repo/ ; \
  cp -r /cdrom/rhythm-kiosk/. /target/root/rhythm-kiosk/ ; \
  in-target sh -c "echo rhythm-kiosk > /etc/hostname" ; \
  in-target sh -c "grep -q rhythm-kiosk /etc/hosts || echo '127.0.1.1	rhythm-kiosk' >> /etc/hosts" ; \
  in-target sh -c "sed -i 's/^deb cdrom:/# deb cdrom:/' /etc/apt/sources.list" ; \
  in-target sh -c "echo 'deb [trusted=yes] file:/var/rhythm-repo ./' > /etc/apt/sources.list.d/rhythm-repo.list" ; \
  in-target apt-get update ; \
  in-target env RK_UNATTENDED=1 bash /root/rhythm-kiosk/rhythm-kiosk-installer.sh

d-i finish-install/reboot_in_progress note
